<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo chuỗi ngẫu nhiên</title>
    
    <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f2f2f2;
}
.container{
    width:600px;
    margin:60px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
    text-align:center;
}
h1{
    color:#0d6efd;
    margin-bottom:30px;
}
button{
    padding:15px 25px;
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:18px;
}
button:hover{
    background:#0b5ed7;
}
#password{
    margin-top:30px;
    font-size:30px;
    color:red;
    font-weight:bold;
    letter-spacing:4px;
}
.back{
    margin-top:40px;
}
.back a{
    text-decoration:none;
    background:#198754;
    color:white;
    padding:12px 20px;
    border-radius:5px;
}
.back a:hover{
    background:#157347;
}
      
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Tạo Chuỗi Ngẫu Nhiên</h1>
      <p>Nhấn nút để tạo mật khẩu gồm 8 ký tự.</p>
      <br>
      <button onclick="taoMatKhau()">Tạo mật khẩu</button>
      
      <div id="password"></div>
      
      <div class="back">
        <a href="index.html">← Quay về Trang Chủ</a>
      </div>
    </div>
    
    <script>
      function taoMatKhau(){
        let kyTu="abcdefghijklmnopqrstuvwxyz0123456789";
        let ketQua="";
        for(let i=0;i<8;i++){
          let viTri=Math.floor(Math.random()*kyTu.length);
          ketQua+=kyTu.charAt(viTri);
        }
        document.getElementById("password").innerHTML=ketQua;
      }
    </script>
    
  </body>
</html>
